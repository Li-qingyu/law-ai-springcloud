server:
  port: 8083


spring:
  application:
    name: law-ai-service
  config:
    import:
      - nacos:common.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:common-security.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:law-ai-service.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      serverAddr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      discovery:
        group: DEFAULT_GROUP
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: qwen3.5-flash
          temperature: 0.8
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
    vectorstore:
      milvus:
        databaseName: law_ai
        url: http://localhost:19530
        embeddingDimension: 1024
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: org.law.ai.entity

logging:
  level:
    org.law.ai.mapper: debug