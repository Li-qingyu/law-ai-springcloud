server:
  port: 8083

spring:
  application:
    name: law-ai-service
  config:
    import:
      - nacos:common.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:common-security.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:law-ai-service.yml?group=DEFAULT_GROUP&refreshEnabled=true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 2
  cloud:
    nacos:
      serverAddr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      discovery:
        group: DEFAULT_GROUP



