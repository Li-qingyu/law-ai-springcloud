server:
  port: 8082

spring:
  application:
    name: law-law-service
  config:
    import:
      - nacos:common.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:common-security.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:law-law-service.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      serverAddr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      discovery:
        group: DEFAULT_GROUP
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.law.law.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.law.law.mapper: debug