server:
  port: 80

spring:
  main:
    web-application-type: reactive
  application:
    name: law-gateway
  config:
    import:
      - nacos:common-security.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:law-gateway.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      serverAddr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      discovery:
        group: DEFAULT_GROUP
    gateway:
      server:
        webflux:
          routes:
            # 用户服务路由 ,lb为负载均衡的转发
            - id: user-service
              uri: lb://law-user-service
              predicates:
                - Path=/admin/users/**, /test/**,/login,/register,/sendEmailCode,/resetPassword,/guest/**
              filters:
                - StripPrefix=0
            # 法典服务路由
            - id: law-service
              uri: lb://law-law-service
              predicates:
                - Path=/admin/types/**,/admin/law-books/**,/admin/law-articles/**,/user/collection/**,/admin/case/**,/user/case/**,/user/home/**
              filters:
                - StripPrefix=0

            # AI服务路由
            - id: ai-service
              uri: lb://law-ai-service
              predicates:
                - Path=/user/ai/**,/admin/ai/**,/admin/ai-config/**,/admin/token/**,/internal/ai-config/**
              filters:
                - StripPrefix=0


            # 通用服务路由
            - id: common-service
              uri: lb://law-common-service
              predicates:
                - Path= /upload/**, /admin/work-space/**,/admin/dashboard/**
              filters:
                - StripPrefix=0
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          discovery:
            locator:
              enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

# 白名单路径（不需要鉴权）
gateway:
  whitelist:
    - /login
    - /register
    - /sendEmailCode
    - /resetPassword
    - /upload
    - /api/carousel/list
    - /api/law/books
    - /api/law/cases
    - /test/public
    - /guest/init
    - /internal/**