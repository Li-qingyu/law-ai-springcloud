server:
  port: 8084

spring:
  application:
    name: law-common-service
  config:
    import:
      - nacos:common.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:common-security.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:common-oss.yml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:law-common-service.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      serverAddr: ${NACOS_ADDR:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      discovery:
        group: DEFAULT_GROUP

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: org.law.common.service.entity

logging:
  level:
    org.law.common.service.mapper: debug